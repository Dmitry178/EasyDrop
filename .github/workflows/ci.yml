name: CI

# Action versions are pinned to a major that runs on Node 24, so GitHub does not
# warn on every job. Nothing in this repository uses Node.js.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# The workflow only ever needs to read the repository. Release publishing is a
# deliberate, separate step – see the tag job below.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The authoritative gate. Everything else may fail, but a red verify means
  # nothing else was worth looking at.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # go.mod is the single source of truth for the toolchain, so CI cannot
          # drift onto a Go version the project does not claim to support.
          go-version-file: go.mod
          cache: true
      - name: Platform matrix is in sync with the Makefile
        run: make check-platforms
      - name: gofmt, go vet, tests
        run: make verify
      - name: tests under the race detector
        run: make test-race

  # Real end-to-end on a runner with a docker daemon: builds a throwaway image,
  # deploys it, checks status and logs. `make verify` proves the unit contract;
  # this proves the product still works.
  smoke:
    name: smoke (end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make smoke

  # Cross-compilation. Every triple builds on one Linux runner: CGO is off
  # everywhere, so no cross toolchain is involved and a per-OS runner would only
  # add minutes. One job per triple anyway, so a break names the platform
  # instead of "the release job".
  build:
    name: build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            artifact: easydrop-linux-amd64
          - platform: linux/arm64
            artifact: easydrop-linux-arm64
          - platform: darwin/amd64
            artifact: easydrop-darwin-amd64
          - platform: darwin/arm64
            artifact: easydrop-darwin-arm64
          - platform: windows/amd64
            artifact: easydrop-windows-amd64
          - platform: windows/arm64
            artifact: easydrop-windows-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: make build-platform PLATFORM=${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: bin/dist/*
          if-no-files-found: error

  # A cross-compiled binary is never *run* by the build job, so a platform whose
  # tests behave differently would ship green. These run the suite natively.
  test-native:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -count=1

  # On a tag: build every platform, then publish the release page itself.
  # `contents: write` is scoped to this one job — the rest of the workflow stays
  # read-only, so no other job can touch the repository.
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # A release whose binaries report a different number than the tag they
      # were published under is worse than no release: the version is what users
      # file bugs against, and nothing downstream would notice. Cheap to check,
      # and it must run BEFORE anything is built so the failure is unambiguous.
      - name: Tag matches the version in the source and the changelog
        run: make check-version EXPECTED="${GITHUB_REF_NAME#v}"
      - name: Stamp the binary with the tag, not the commit hash
        run: make release VERSION="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v7
        with:
          # ${{ github.ref_name }}, not ${GITHUB_REF_NAME}: an action input is not
          # a shell, so shell parameter expansion is passed through literally and
          # the artifact gets named after the variable. Only `run:` expands
          # $GITHUB_REF_NAME. Guarded by `make check-workflow`.
          name: easydrop-${{ github.ref_name }}
          path: bin/dist/*
          if-no-files-found: error
      # Publishing is idempotent on purpose: a re-run of this workflow – a flaky
      # test rerun, a re-pushed tag on a rebuilt commit – must replace the assets
      # rather than fail on "release already exists". `gh release upload
      # --clobber` is the difference between a rerun and a stuck pipeline.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists – replacing its assets"
            gh release upload "$TAG" bin/dist/* --clobber
          else
            gh release create "$TAG" \
              --title "EasyDrop $TAG" \
              --generate-notes \
              bin/dist/*
          fi
          echo
          gh release view "$TAG" --json name,tagName,url,assets \
            --jq '"release \(.name) (\(.tagName)) -> \(.url)",
                  (.assets[] | "  \(.name)")'