# 04 – Remote host with a password
# The rare host where you cannot install a public key. EasyDrop tries three auth
# methods, in order: the key file, then ssh-agent, then `server.password`.
#
# ─────────────────────────────────────────────────────────────────────────────
# The one question that decides how to write this file:
#
#     DOES THIS easydrop.toml GO INTO GIT?
#
# ── YES, the config is shared (team repo, CI checkout) ─────────────────────
# Keep the file secret-free. Two good options:
#
#   Method A (preferred) – let ssh-agent hold the credential. Nothing secret
#   lives in the project at all:
#
#       eval "$(ssh-agent -s)"          # once per shell
#       ssh-add ~/.ssh/id_ed25519       # the key never touches easydrop.toml
#
#     Leave `server.ssh_key` and `server.password` empty and EasyDrop picks the
#     agent up through SSH_AUTH_SOCK. This is also the only way to use a key
#     that has a passphrase: encrypted private keys cannot be parsed directly.
#
#   Method B (preferred) – interpolate the password from a secret file:
#
#       in THIS file:      password = "${EASYDROP_SSH_PASSWORD}"
#       in .easydrop.env:  EASYDROP_SSH_PASSWORD=hunter2      ← git-ignored
#
#     `.env` works too, and when both exist `.easydrop.env` wins. Both are
#     git-ignored and both are excluded from the archive shipped to the host,
#     so the credential never reaches the server. See
#     20-secrets-from-env.toml for the full mechanism, `${VAR:-default}` and
#     CI injection.
#
#   Writing the password literally is discouraged for a committed config: it
#   is a live credential in git history, in every clone, in any CI log that
#   prints a diff, and in every backup – and rotating the password later
#   removes it from none of those.
#
# ── NO, the config never reaches a VCS ─────────────────────────────────────
# (local experiments, a throwaway box, a personal project you keep out of git)
#
#   Method C – a literal password is perfectly fine here. Nothing leaks it,
#   because no repository ever sees the file. Two cheap precautions:
#
#       chmod 600 easydrop.toml
#       echo easydrop.toml >> .git/info/exclude   # belt-and-braces, in case
#                                                 # you later `git add .`
#
# This is the fastest route and the reason it is still documented: for a box you
# will throw away tomorrow, a literal beats wiring up an agent or a secret file.
#
# Order of preference for a committed config: ssh-agent → ${VAR} from a secret
# file → literal only when the file itself never leaves your machine.

[app]
name = "my-awesome-api"
port = 8080

[server]
host = "203.0.113.10"
user = "deploy"

# Method A: leave `ssh_key` empty and let ssh-agent authenticate.
# Method B/C see the header above. Uncomment exactly one of these:
ssh_key = ""
# password = "${EASYDROP_SSH_PASSWORD}"   # Method B: value in .easydrop.env
# password = "hunter2"                    # Method C: only if this file is
#                                         # never committed (see header)

# Default is 22; raise it if the host was hardened.
port = 22

[build]
strategy = "remote"

[driver]
type = "single"

[nginx]
domain = ""
ssl = false
