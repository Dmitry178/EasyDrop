# 20 – Secrets from the environment, not from git
# Use this when easydrop.toml IS committed (team repo, CI checkout) and must
# stay free of literals. The config carries a ${VAR} reference, the value lives
# outside the repository – so the file is safe to commit as-is.
#
# If your config never enters a VCS (local experiments, a throwaway box), a
# literal `server.password = "hunter2"` is perfectly fine and simpler: nothing
# leaks it, because no repository ever sees the file. Just `chmod 600` it and
# add it to `.git/info/exclude` so a later `git add .` cannot sweep it up. See
# 04-remote-ssh-password.toml for that path.
#
# Ways to supply SSH credentials:
#   1. ssh-agent – no secret anywhere in the project:
#      `eval "$(ssh-agent -s)" && ssh-add ~/.ssh/id_ed25519`, then leave
#      `server.ssh_key` and `server.password` empty.
#   2. ${VAR} from a secret file (what this example demonstrates) – the choice
#      for a committed config.
#   3. a literal password – fine for a config that stays off git, discouraged
#      for one that does not.
#
# Create the secret file (both names are read, and both are git-ignored):
#
#   printf 'EASYDROP_SSH_PASSWORD=hunter2\nEASYDROP_REGISTRY=ghcr.io/myorg\n' > .easydrop.env
#
# `.easydrop.env` is easydrop's own file and takes priority over `.env`, which
# may already belong to docker compose. A real `export` in your shell beats
# both, so CI can inject the value without writing a file at all:
#
#   EASYDROP_SSH_PASSWORD=... easydrop deploy
#
# Semantics:
#   ${VAR}        required – unset or empty is a hard error naming the field
#   ${VAR:-def}   `def` applies when VAR is unset or empty
#   $$            a literal "$"
#
# Files like this one are excluded from the archive shipped to the host, so a
# password in .easydrop.env never travels to the server. A project that needs
# its .env inside the bundle re-includes it in .dockerignore with `!.env`.

[app]
name = "my-awesome-api"
port = 8080
health_check_path = "${EASYDROP_HEALTH_PATH:-/healthz}"

[server]
host = "203.0.113.10"
user = "deploy"
# Falls back to the usual key path when EASYDROP_SSH_KEY is unset; the "~" is
# expanded after interpolation.
ssh_key = "${EASYDROP_SSH_KEY:-~/.ssh/id_ed25519}"
# Required: deploying fails immediately (before any SSH connection) when the
# variable is missing, instead of failing on the host with an auth error.
password = "${EASYDROP_SSH_PASSWORD}"

[build]
strategy = "local"
registry = "${EASYDROP_REGISTRY:-ghcr.io/myorg}"
image = "web:2.1"

[driver]
type = "single"
blue_green = true

[nginx]
domain = "api.example.com"
ssl = true
email = "${EASYDROP_ACME_EMAIL:-ops@example.com}"
